<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة الإصدارات - مدرسة التسبيح - كنيسة الشهيد العظيم مارمرقس الرسول ببني صامت</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Cairo & Tajawal) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        coptic: {
                            gold: '#D4AF37',
                            darkGold: '#AA7C11',
                            navy: '#0F172A',
                            sky: '#0284C7',
                            lightSky: '#E0F2FE',
                            deepSky: '#0369A1',
                            burgundy: '#800020',
                            cream: '#F8FAFC'
                        }
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                        tajawal: ['Tajawal', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #F8FAFC; text-align: center; }
        .reader-container { position: relative; }
    </style>
</head>
<body class="bg-coptic-cream text-slate-800 font-cairo antialiased min-h-screen flex flex-col justify-between">

    <!-- MAIN CONTENT AREA -->
    <main class="flex-grow">
        
        <!-- PUBLICATIONS SECTION -->
        <div id="page-publications" class="page-content max-w-7xl mx-auto px-4 py-10 text-right">
            <div class="bg-gradient-to-r from-coptic-deepSky to-coptic-sky text-white rounded-3xl p-8 md:p-12 mb-12 shadow-xl text-center relative overflow-hidden border-b-4 border-coptic-gold">
                <div class="relative z-10 max-w-3xl mx-auto">
                    <div class="w-16 h-16 bg-white/20 rounded-2xl flex items-center justify-center mx-auto mb-4 text-3xl shadow-inner border border-white/30 text-coptic-gold">
                        <i class="fa-solid fa-book-bookmark"></i>
                    </div>
                    <h3 class="text-3xl md:text-4xl font-extrabold mb-3">مكتبة الإصدارات والكتب الطقسية</h3>
                    <p class="text-sky-100 text-base md:text-lg leading-relaxed">
                        تصفح وقراءة الكتب والألحان والإصدارات الليتورجية والطقسية الصادرة عن مدرسة التسبيح ببني صامت أونلاين مباشرة.
                    </p>
                </div>
            </div>

            <div id="books-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            </div>
        </div>

        <!-- ONLINE VIEWER PAGE (مدمج لعرض الكتب داخل الصفحة بنفس التصميم والأمان) -->
        <div id="page-reader" class="page-content hidden max-w-5xl mx-auto px-4 py-10 text-right">
            <button onclick="goBackToPrevious()" class="mb-6 text-coptic-sky font-bold hover:underline flex items-center gap-2">
                <i class="fa-solid fa-arrow-right"></i>
                <span>العودة للقائمة</span>
            </button>
            <div class="bg-white rounded-3xl shadow-xl border border-slate-200 overflow-hidden p-4">
                <div class="flex justify-between items-center mb-4 px-2 pb-3 border-b border-slate-100">
                    <h4 id="reader-title" class="font-bold text-lg text-coptic-deepSky">عرض الكتاب للقراءة</h4>
                    <span class="text-xs bg-sky-50 text-coptic-sky font-semibold px-3 py-1 rounded-full border border-sky-200">وضع القراءة الآمن أونلاين فقط</span>
                </div>
                <div class="reader-container w-full h-[750px] bg-slate-100 rounded-2xl overflow-hidden relative">
                    <iframe id="reader-frame" src="" class="w-full h-full border-0 pointer-events-auto" sandbox="allow-scripts allow-same-origin"></iframe>
                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-coptic-deepSky text-slate-200 py-8 px-4 border-t-2 border-coptic-gold mt-12 text-center">
        <div class="max-w-7xl mx-auto space-y-3">
            <p class="text-coptic-gold font-bold text-lg">كنيسة الشهيد العظيم مارمرقس الرسول ببني صامت</p>
            <p class="text-xs text-sky-200">جميع الحقوق محفوظة © 2026 - مدرسة التسبيح</p>
        </div>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        const booksList = [
            { id: 1, name: "رَفع بَخور باكِرٍ لعيد القيامة المَجيد", icon: "fa-sun", bgGradient: "from-amber-500 to-amber-700", copticLink: "", copticArLink: "" },
            { id: 2, name: "ليتورجيَّة عيد القيامة المَجيد", icon: "fa-cross", bgGradient: "from-yellow-600 to-amber-800", copticLink: "", copticArLink: "https://drive.google.com/file/d/1vfSEPQei_nANQ2m_DjRKSRKRhUP2vo8x/preview" },
            { id: 3, name: "رَفع بخور عَشيَّةٍ وباكِرٍ لعيدَي الصُّعودِ والعَنصرةِ", icon: "fa-cloud-arrow-up", bgGradient: "from-sky-500 to-blue-700", copticLink: "", copticArLink: "" },
            { id: 4, name: "ليتورجيَّة عيدَي الصعود والعَنصرة", icon: "fa-dove", bgGradient: "from-blue-500 to-indigo-700", copticLink: "", copticArLink: "" },
            { id: 5, name: "ألحان تُقال في حُضور الأب البطريرك والآباء المَطارنة والأساقفة", icon: "fa-crown", bgGradient: "from-amber-600 to-yellow-800", copticLink: "", copticArLink: "" },
            { id: 6, name: "قراءات آحاد شَهر أبيب المُبارَك", icon: "fa-book-open", bgGradient: "from-emerald-500 to-teal-700", copticLink: "", copticArLink: "" },
            { id: 7, name: "الطَقس السنوي (1) رَفعُ بَخورَي عشيَّةٍ وباكِرٍ", icon: "fa-smog", bgGradient: "from-blue-600 to-sky-800", copticLink: "", copticArLink: "https://drive.google.com/file/d/1HGl_Tb-L5nr1vEEPFpvoYwq-CC20mQbP/preview" },
            { id: 8, name: "ألحان صوم القديسة العَذراء مريَم", icon: "fa-star", bgGradient: "from-indigo-600 to-purple-800", copticLink: "https://drive.google.com/file/d/1g7BRF5dMjjDzFH9LWZ5EMMXoWUY2oVx_/preview", copticArLink: "https://drive.google.com/file/d/1bS40GuNB_D-lP4BMoTz9OX8eI_q2IsRb/preview" },
            { id: 9, name: "طَقس شَهر كيَهك المُبارَك", icon: "fa-music", bgGradient: "from-purple-600 to-indigo-900", copticLink: "", copticArLink: "" },
            { id: 10, name: "تَسبحة ليالي آحاد شَهر كيَهك المُبارَك", icon: "fa-moon", bgGradient: "from-purple-700 to-pink-900", copticLink: "https://drive.google.com/file/d/1xC_2ADnklyM_K1L6Sb8lJ0ZFWERCh0k6/preview", copticArLink: "https://drive.google.com/file/d/1uKmCO8PxN_Ea-sBd34N0TgnceW23xBYd/preview" },
            { id: 11, name: "رَفع بخور باكِرٍ لعيد الميلاد المَجيد", icon: "fa-holly-berry", bgGradient: "from-red-600 to-rose-900", copticLink: "", copticArLink: "" },
            { id: 12, name: "ليتورجيَّة عيد الميلاد المجيد", icon: "fa-baby-carriage", bgGradient: "from-red-700 to-amber-900", copticLink: "", copticArLink: "https://drive.google.com/file/d/1KjHwZ8KL1zaOnj74lBn6yYn8BnZ9gU-G/preview" },
            { id: 13, name: "رَفع بخور باكِرٍ لعيد الغِطاس المَجيد", icon: "fa-droplet", bgGradient: "from-cyan-600 to-blue-800", copticLink: "", copticArLink: "" },
            { id: 14, name: "لقَّان وليتورجيَّة عيد الغِطاس المَجيد", icon: "fa-water", bgGradient: "from-teal-600 to-cyan-900", copticLink: "", copticArLink: "https://drive.google.com/file/d/1ISulqRCl5disAABcczvcwXz3NWCz1eld/preview" },
            { id: 15, name: "ليتورجيَّة الصوم المُقَدَّس الكبير", icon: "fa-dharmachakra", bgGradient: "from-purple-800 to-slate-900", copticLink: "", copticArLink: "https://drive.google.com/file/d/1Pb27HyCzEbZ_28pu3AU4uyJrqNmOJozJ/preview" },
            { id: 16, name: "طَقس عيد أحَد الشعانين", icon: "fa-tree", bgGradient: "from-green-600 to-emerald-900", copticLink: "", copticArLink: "https://drive.google.com/file/d/1LFVU2LLLvKWkthmdZoOhYGqgc9eCpXuZ/preview" },
            { id: 17, name: "ألحان صوم الآباء الرُّسُل", icon: "fa-users-gear", bgGradient: "from-teal-600 to-blue-900", copticLink: "", copticArLink: "" },
            { id: 18, name: "ما يُقال في تماجيد الشُهداء والقديسين", icon: "fa-award", bgGradient: "from-yellow-600 to-amber-900", copticLink: "https://drive.google.com/file/d/1GOnt8Wf7w2veVnJEBwAKnBIkcnZm54WW/preview", copticArLink: "https://drive.google.com/file/d/1FBpARS_lrKilr3KgY6Z_t3eM3qqiXRCN/preview" },
            { id: 19, name: "طَقس عيدَي الصليب المَجيد", icon: "fa-kaaba", bgGradient: "from-rose-700 to-red-900", copticLink: "", copticArLink: "" },
            { id: 20, name: "سِر مَسحة المَرضَي (القِنديل)", icon: "fa-oil-can", bgGradient: "from-amber-700 to-yellow-900", copticLink: "https://drive.google.com/file/d/1Vssm-Rq-pj_tUWuKYlKsLeeXunTnF84a/preview", copticArLink: "" },
            { id: 21, name: "قراءَات آحاد شَهر بؤوني المُبارَك", icon: "fa-scroll", bgGradient: "from-emerald-700 to-green-900", copticLink: "", copticArLink: "" },
            { id: 22, name: "طَقس جُمعة خِتام الصَّوم وَسَبت لِعازَر", icon: "fa-heart-pulse", bgGradient: "from-purple-900 to-slate-900", copticLink: "", copticArLink: "https://drive.google.com/file/d/1m59MAGDtik7db6htAD2LWdYyUB6U1hWJ/preview" },
            { id: 23, name: "الإبصَلموديَّة المُقَدَّسَة السَنَويَّة (1) تَسبِحَة يَومَيّ السَّبت وَالأحَد", icon: "fa-book", bgGradient: "from-blue-800 to-indigo-950", copticLink: "https://drive.google.com/file/d/1eMgo49V3Q69wBfFdyHdWQjixQH1AdPL7/preview", copticArLink: "https://drive.google.com/file/d/1aDASHE-1exXatfciTlfQ3kUJV9C_N-Hb/preview" },
            { id: 24, name: "البَصخَة المُقَدَّسَة، سَبتُ الفَرَحِ", icon: "fa-cloud-sun", bgGradient: "from-slate-700 to-slate-950", copticLink: "https://drive.google.com/file/d/15LXgnYBefAqrXy4R3dJd4X0TCecazRCk/preview", copticArLink: "https://drive.google.com/file/d/1pBjCrIksDyY06nyOzUpAPERSkPB2Htcg/preview" },
            { id: 25, name: "البصخة المقدسة، خميس العهد", icon: "fa-bread-slice", bgGradient: "from-amber-900 to-stone-950", copticLink: "https://drive.google.com/file/d/1R4UJ0rZx6YlpcaeqktOTXLjn1vOej3YJ/preview", copticArLink: "https://drive.google.com/file/d/1KuPsNDXEUAGKT__93PdB0CGBzzGMZ9JI/preview" }
        ];

        function renderBooks() {
            const grid = document.getElementById('books-grid');
            if (!grid) return;
            
            grid.innerHTML = booksList.map(book => {
                let buttonsHtml = '';
                let arLink = book.copticArLink.replace('/view?usp=drive_link', '/preview').replace('/view', '/preview');
                let coLink = book.copticLink.replace('/view?usp=drive_link', '/preview').replace('/view', '/preview');

                if (book.copticArLink) {
                    buttonsHtml += `<button onclick="openReader('${book.name} (قبطي مُعرَّب)', '${arLink}')" class="w-full bg-coptic-sky text-white font-bold py-2 px-3 rounded-lg hover:bg-coptic-deepSky transition text-xs mb-2">قبطي مُعرَّب</button>`;
                }
                if (book.copticLink) {
                    buttonsHtml += `<button onclick="openReader('${book.name} (قبطي قبطي)', '${coLink}')" class="w-full bg-amber-600 text-white font-bold py-2 px-3 rounded-lg hover:bg-amber-700 transition text-xs">قبطي قبطي</button>`;
                }
                if (!book.copticArLink && !book.copticLink) {
                    buttonsHtml += `<span class="text-xs text-slate-400 italic">قريباً...</span>`;
                }

                return `
                    <div class="bg-white rounded-2xl shadow-md border border-slate-200 overflow-hidden flex flex-col justify-between hover:shadow-xl transition">
                        <div class="bg-gradient-to-r ${book.bgGradient} p-6 text-white text-center">
                            <div class="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center mx-auto mb-3 text-2xl shadow-inner">
                                <i class="fa-solid ${book.icon}"></i>
                            </div>
                            <h4 class="font-bold text-base leading-snug">${book.name}</h4>
                        </div>
                        <div class="p-4 bg-slate-50 border-t border-slate-100 text-center">
                            ${buttonsHtml}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openReader(title, link) {
            document.getElementById('page-publications').classList.add('hidden');
            document.getElementById('page-reader').classList.remove('hidden');
            document.getElementById('reader-title').textContent = title;
            document.getElementById('reader-frame').src = link;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function goBackToPrevious() {
            document.getElementById('page-reader').classList.add('hidden');
            document.getElementById('page-publications').classList.remove('hidden');
            document.getElementById('reader-frame').src = '';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // تشغيل الدالة تلقائياً عند تحميل الصفحة
        window.onload = function() {
            renderBooks();
        };
    </script>
</body>
</html>
