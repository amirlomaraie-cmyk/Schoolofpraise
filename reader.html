<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عرض الملف - مدرسة التسبيح</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { coptic: { sky: '#0284C7', deepSky: '#0369A1', gold: '#D4AF37', cream: '#F8FAFC' } } }
            }
        }
    </script>
    <style>body { font-family: 'Cairo', sans-serif; background-color: #F8FAFC; text-align: center; }</style>
</head>
<body class="bg-coptic-cream text-slate-800 font-cairo antialiased min-h-screen flex flex-col justify-between" onload="initReader()">

    <header class="bg-coptic-sky text-white shadow-xl sticky top-0 z-50 border-b-2 border-coptic-gold">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-extrabold text-white">مدرسة التسبيح - القارئ الإلكتروني</h1>
            <button onclick="history.back()" class="bg-white/20 hover:bg-white/30 text-white text-xs px-3 py-1.5 rounded-lg transition flex items-center gap-1">
                <i class="fa-solid fa-arrow-right"></i> العودة للخلف
            </button>
        </div>
    </header>

    <main class="flex-grow max-w-5xl mx-auto px-4 py-8 text-right w-full">
        <div class="bg-white rounded-3xl shadow-xl border border-slate-200 overflow-hidden p-4">
            <div class="flex justify-between items-center mb-4 px-2 pb-3 border-b border-slate-100">
                <h4 id="reader-title" class="font-bold text-lg text-coptic-deepSky">جاري التحميل...</h4>
                <span class="text-xs bg-sky-50 text-coptic-sky font-semibold px-3 py-1 rounded-full border border-sky-200">وضع القراءة أونلاين</span>
            </div>
            <div class="w-full h-[750px] bg-slate-100 rounded-2xl overflow-hidden relative">
                <iframe id="reader-frame" src="" class="w-full h-full border-0" sandbox="allow-scripts allow-same-origin"></iframe>
            </div>
        </div>
    </main>

    <footer class="bg-coptic-deepSky text-slate-200 py-6 px-4 text-center border-t-2 border-coptic-gold">
        <p class="text-xs text-sky-200">جميع الحقوق محفوظة © 2026 - مدرسة التسبيح</p>
    </footer>

    <script>
        function initReader() {
            const urlParams = new URLSearchParams(window.location.search);
            const title = urlParams.get('title');
            const url = urlParams.get('url');

            if (title) document.getElementById('reader-title').textContent = decodeURIComponent(title);
            if (url) document.getElementById('reader-frame').src = decodeURIComponent(url);
        }
    </script>
</body>
</html>
